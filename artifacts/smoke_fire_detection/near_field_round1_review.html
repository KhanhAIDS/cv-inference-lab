let index = 0;
const storageKey = 'near_field_round1_review_state';
const state = JSON.parse(localStorage.getItem(storageKey) || '{}');
const canvas = document.querySelector('#image');
const context = canvas.getContext('2d');
const meta = document.querySelector('#meta');
const note = document.querySelector('#note');
function saveNote() {
  const record = records[index];
  localStorage.setItem(storageKey, JSON.stringify(state));
  state[record.review_id] = {...(state[record.review_id] || {}), note: note.value};
}
function render() {
  const record = records[index];
  note.value = state[record.review_id]?.note || '';
  meta.textContent = `${index + 1}/${records.length} · ${record.review_id} · ${record.source} · ${record.category} · nhãn: ${record.dataset_classes.join(', ') || 'empty'}`;
  const image = new Image();
  image.onload = () => {
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    context.drawImage(image, 0, 0);
    for (const box of record.dataset_boxes) {
      context.strokeStyle = box.class === 'fire' ? '#ff3030' : '#00a8ff';
      context.lineWidth = Math.max(2, image.naturalWidth / 400);
      context.strokeRect((box.center_x - box.width / 2) * canvas.width, (box.center_y - box.height / 2) * canvas.height, box.width * canvas.width, box.height * canvas.height);
    }
  };
  image.src = '../../' + record.image;
}
function mark(status) {
  localStorage.setItem(storageKey, JSON.stringify(state));
  saveNote();
  state[records[index].review_id] = {...(state[records[index].review_id] || {}), status};
  next();
}
function next() { saveNote(); index = Math.min(index + 1, records.length - 1); render(); }
function previous() { saveNote(); index = Math.max(index - 1, 0); render(); }
function downloadDecisions() {
  saveNote();
  const decisions = records.map(record => ({review_id: record.review_id, image: record.image, source: record.source, dataset_classes: record.dataset_classes, ...(state[record.review_id] || {status: 'pending', note: ''})}));
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([JSON.stringify(decisions, null, 2)], {type: 'application/json'}));
  link.download = 'near_field_round1_review_decisions.json';
  link.click();
}
addEventListener('keydown', event => {
  const status = {'1': 'pass', '2': 'missing', '3': 'wrong_or_extra', '4': 'uncertain'}[event.key];
  if (status) mark(status);
  if (event.key === 'ArrowRight') next();
  if (event.key === 'ArrowLeft') previous();
});
render();
